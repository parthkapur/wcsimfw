# Elo from the results history plus a squad rating (SoFIFA roster dated before kickoff);
# mu, slope and the squad weight measured together on competitive matches rated by an
# earlier roster (needs the data).
tournament = "wc2026"
origins = ["kickoff", "md1", "md2", "md3", "r32", "r16", "qf", "sf"]
draws = 100_000
seed = 0
device = "cpu"

[model]
name = "elo_poisson"
elo = "history"
update = false
squad = "sofifa"

[model.fit]
matches = "competitive"

[model.params]
mu = { kind = "fitted", source = "Poisson fit, competitive matches in the year after each earlier roster" }
slope = { kind = "fitted", source = "Poisson fit, same matches" }
squad_weight = { kind = "fitted", source = "Poisson fit, same matches: Elo points per point of squad rating" }
extra_time = { value = 0.3333333333333333, kind = "fixed", source = "30 of 90 minutes at the same rate" }
shootout = { value = 0.5, kind = "fixed", source = "coin: shootout skill is weak evidence" }
