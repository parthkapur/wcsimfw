# Elo reference model on WC2026, scored at kickoff and after each stage.
tournament = "wc2026"
origins = ["kickoff", "md1", "md2", "md3", "r32", "r16", "qf", "sf"]
draws = 100_000
seed = 0
device = "cpu"  # or "cuda"

[model]
name = "elo_poisson"  # Elo from the reference table elo.json (dated before kickoff)

[model.params]
mu = { value = 1.30, kind = "fixed", source = "goals per team per match between equal sides, set by hand" }
slope = { value = 0.54, kind = "fixed", source = "set by hand; a fit to WC2018 and WC2022 gives nearly the same" }
extra_time = { value = 0.3333333333333333, kind = "fixed", source = "30 of 90 minutes at the same rate" }
shootout = { value = 0.5, kind = "fixed", source = "coin: shootout skill is weak evidence" }
