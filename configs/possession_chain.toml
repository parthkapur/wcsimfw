# Possession Markov chain: goal rates from how possessions move through the thirds, in the Elo
# gap and each side's own past moves; fitted on earlier national-team tournaments (needs the data).
tournament = "wc2026"
origins = ["kickoff", "md1", "md2", "md3", "r32", "r16", "qf", "sf"]
draws = 100_000
seed = 0
device = "cpu"

[model]
name = "possession_chain"
elo = "history"
update = false

[model.params]
chain = { kind = "fitted", source = "maximum likelihood on the counted moves of earlier tournaments (openplay events)" }
style = { value = 3.0, kind = "fixed", source = "matches of own play that weigh as much as the rating; chosen on goals of the 2018-2025 tournaments" }
home = { kind = "fitted", source = "goals of home sides against the chain, same tournaments" }
level = { kind = "fitted", source = "spread of the goal totals of the same tournaments" }
extra_time = { value = 0.3333333333333333, kind = "fixed", source = "30 of 90 minutes at the same rate" }
shootout = { value = 0.5, kind = "fixed", source = "coin: shootout skill is weak evidence" }
