# Elo from the results history, a host bonus, the tournament's goal level, and what each
# registered squad (SoFIFA eleven) says beyond its rating; all measured before kickoff
# (needs the data).
tournament = "wc2026"
origins = ["kickoff", "md1", "md2", "md3", "r32", "r16", "qf", "sf"]
draws = 100_000
seed = 0
device = "cpu"

[model]
name = "elo_poisson"
elo = "history"
update = false

[model.fit]
since = "2010-01-01"
matches = "finals"

[model.players]
source = "sofifa"

[model.params]
mu = { kind = "fitted", source = "Poisson fit, finals since 2010 before kickoff" }
slope = { kind = "fitted", source = "Poisson fit, finals since 2010 before kickoff" }
home = { kind = "fitted", source = "Poisson fit, finals since 2010 before kickoff" }
features = { kind = "fitted", source = "same fit; squads of the earlier tournaments" }
level = { kind = "fitted", source = "spread of the goal totals of finals since 2010" }
extra_time = { value = 0.3333333333333333, kind = "fixed", source = "30 of 90 minutes at the same rate" }
shootout = { value = 0.5, kind = "fixed", source = "coin: shootout skill is weak evidence" }
